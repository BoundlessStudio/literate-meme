<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Database Marketplace Console</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
        background: transparent;
        color: inherit;
      }

      .console {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel {
        border-radius: 12px;
        border: 1px solid rgba(128, 128, 128, 0.25);
        padding: 16px;
        background: rgba(0, 0, 0, 0.02);
        backdrop-filter: blur(2px);
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .plan-list {
        display: grid;
        gap: 12px;
      }

      .plan-card {
        border-radius: 10px;
        border: 1px solid rgba(128, 128, 128, 0.2);
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
      }

      .plan-card h3 {
        margin: 0 0 4px;
        font-size: 1.05rem;
      }

      .plan-card .price {
        font-weight: 600;
      }

      .plan-card ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .key-values {
        display: grid;
        gap: 8px;
      }

      .key-value {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        border: 1px solid rgba(128, 128, 128, 0.2);
        padding: 6px 8px;
        font-size: 0.9rem;
      }

      th {
        background: rgba(128, 128, 128, 0.15);
      }

      .empty {
        text-align: center;
        padding: 24px;
        color: rgba(128, 128, 128, 0.8);
      }

      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.08);
      }

      .error {
        color: #d33;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="console" id="marketplace-root">
      <div class="panel empty">Waiting for tool output…</div>
    </div>
    <script type="module">
      const root = document.getElementById("marketplace-root");

      function formatCurrency(value) {
        return new Intl.NumberFormat(window.openai?.locale ?? "en", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        }).format(value);
      }

      function formatPlan(plan) {
        if (!plan) return "";
        const capacity = plan.capacity
          ? `${plan.capacity.storageGb}GB storage · ${plan.capacity.queryLimitPerHour} qph`
          : "Usage-based";
        return `${plan.name} — ${plan.headline} (${capacity})`;
      }

      function renderCatalogView(output) {
        const plans = output.plans ?? [];
        const planCards = plans
          .map((plan) => {
            const featureList = plan.features
              ?.slice(0, 3)
              .map((feature) => `<li>${feature}</li>`)
              .join("") ?? "";
            return `
              <article class="plan-card">
                <h3>${plan.name}</h3>
                <div class="price">${formatCurrency(plan.priceUsd)} / month</div>
                <div>${plan.headline}</div>
                <div class="badge">${plan.capacity.storageGb} GB • ${plan.capacity.queryLimitPerHour} qph</div>
                ${featureList ? `<ul>${featureList}</ul>` : ""}
              </article>
            `;
          })
          .join("");

        return `
          <section class="panel">
            <h2>Marketplace Catalog</h2>
            <div class="plan-list">
              ${planCards || '<div class="empty">No plans available.</div>'}
            </div>
          </section>
        `;
      }

      function renderPlanDetails(output) {
        const { plan } = output;
        if (!plan) {
          return '<section class="panel empty">Plan not found.</section>';
        }

        const features = plan.features?.map((feature) => `<li>${feature}</li>`).join("") ?? "";
        const context = plan.context?.map((item) => `<li>${item}</li>`).join("") ?? "";
        const sampleQueries = plan.sampleQueries
          ?.map((query) => `<pre><code>${query}</code></pre>`)
          .join("") ?? "";

        return `
          <section class="panel">
            <h2>${plan.name}</h2>
            <div class="key-values">
              <div class="key-value">
                <strong>Overview</strong>
                <span>${plan.headline}</span>
              </div>
              <div class="key-value">
                <strong>Pitch</strong>
                <span>${plan.pitch}</span>
              </div>
              <div class="key-value">
                <strong>Pricing</strong>
                <span>${formatCurrency(plan.priceUsd)} per month</span>
              </div>
              <div class="key-value">
                <strong>Capacity</strong>
                <span>${plan.capacity.storageGb} GB storage • ${plan.capacity.queryLimitPerHour} queries/hour</span>
              </div>
            </div>
            ${features ? `<h3>Highlights</h3><ul>${features}</ul>` : ""}
            ${context ? `<h3>Schema context</h3><ul>${context}</ul>` : ""}
            ${sampleQueries ? `<h3>Sample queries</h3>${sampleQueries}` : ""}
          </section>
        `;
      }

      function renderOrder(output) {
        const { order, plan } = output;
        if (!order) {
          return '<section class="panel empty">Order details unavailable.</section>';
        }

        return `
          <section class="panel">
            <h2>Order ${order.id}</h2>
            <div class="key-values">
              <div class="key-value"><strong>Status</strong><span class="badge">${order.status}</span></div>
              <div class="key-value"><strong>Plan</strong><span>${formatPlan(plan)}</span></div>
              <div class="key-value"><strong>Buyer</strong><span>${order.buyer.name} · ${order.buyer.email}</span></div>
              ${order.buyer.company ? `<div class="key-value"><strong>Company</strong><span>${order.buyer.company}</span></div>` : ""}
              <div class="key-value"><strong>Total due</strong><span>${formatCurrency(order.totalDueUsd)}</span></div>
              <div class="key-value"><strong>Created</strong><span>${new Date(order.createdAt).toLocaleString()}</span></div>
              ${order.notes ? `<div class="key-value"><strong>Notes</strong><span>${order.notes}</span></div>` : ""}
            </div>
          </section>
        `;
      }

      function renderQuery(output) {
        const { columns = [], rows = [], error } = output;
        const header = columns.map((column) => `<th>${column}</th>`).join("");
        const body = rows
          .map((row) => `<tr>${row.map((value) => `<td>${value ?? ""}</td>`).join("")}</tr>`)
          .join("");

        const fallbackRow = `<tr><td colspan="${columns.length}">No rows</td></tr>`;
        const table = columns.length
          ? `<div class="table-wrapper"><table><thead><tr>${header}</tr></thead><tbody>${body || fallbackRow}</tbody></table></div>`
          : '<div class="empty">No rows returned.</div>';

        const metadata = `
          <div class="key-values">
            <div class="key-value"><strong>Plan</strong><span>${output.planId}</span></div>
            <div class="key-value"><strong>Statement</strong><span><code>${output.sql}</code></span></div>
            <div class="key-value"><strong>Rows</strong><span>${output.rowCount}</span></div>
            ${output.truncated ? '<div class="key-value"><strong>Note</strong><span>First 50 rows shown.</span></div>' : ""}
          </div>
        `;

        return `
          <section class="panel">
            <h2>Query Result</h2>
            ${error ? `<div class="error">${error}</div>` : ""}
            ${metadata}
            ${table}
          </section>
        `;
      }

      function render(output) {
        if (!output) {
          root.innerHTML = '<section class="panel empty">Waiting for tool output…</section>';
          return;
        }

        const sections = [];

        if (output.view === "catalog") {
          sections.push(renderCatalogView(output));
        }

        if (output.view === "plan-details") {
          sections.push(renderPlanDetails(output));
        }

        if (output.view === "order") {
          sections.push(renderOrder(output));
        }

        if (output.view === "query") {
          sections.push(renderQuery(output));
        }

        if (sections.length === 0) {
          sections.push('<section class="panel empty">Unsupported payload.</section>');
        }

        root.innerHTML = sections.join("\n");
      }

      function handleGlobals(event) {
        if (event.detail?.globals?.toolOutput !== undefined) {
          render(window.openai.toolOutput);
        }
      }

      render(window.openai?.toolOutput ?? null);
      window.addEventListener("openai:set_globals", handleGlobals, { passive: true });
    </script>
  </body>
</html>
